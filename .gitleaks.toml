title = "DevKernelPulse Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Allowlist lockfiles, SQL dumps, test fixtures and example SHA-256 hashes"
paths = [
  '''pnpm-lock\.yaml''',
  '''dkp_backup\.sql''',
  '''\.nuxt/.*''',
  '''\.output/.*''',
  '''tests/.*''',
  '''playwright-report/.*''',
  '''test-results/.*'''
]
regexes = [
  '''[a-f0-9]{64}''',
  '''process\.env\.[A-Z0-9_]+'''
]