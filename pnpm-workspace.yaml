shamefullyHoist: true

autoInstallPeers: true

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  puppeteer: true
  unrs-resolver: false
  vue-demi: true

minimumReleaseAgeExclude:
  - nuxt
  - nuxt-nightly
  - '@nuxt/*'
  - vue
  - '@vue/*'

overrides:
  esbuild@<=0.24.2: ^0.25.0

patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
