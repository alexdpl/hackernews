steps:
  # 1. Installa pnpm e dipendenze
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g pnpm
        pnpm install --frozen-lockfile

  # 2. Esegue la build di produzione di Nuxt
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pnpm run build

images:
  - 'gcr.io/$PROJECT_ID/devkernelpulse:$COMMIT_SHA'

# Opzioni di configurazione per evitare errori di bucket/log su GCP
options:
  logging: CLOUD_LOGGING_ONLY