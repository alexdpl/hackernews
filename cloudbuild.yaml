steps:
  # Unico step che installa le dipendenze ed esegue la build di produzione di Nuxt
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g pnpm
        pnpm install --frozen-lockfile
        pnpm run build

images:
  - 'gcr.io/$PROJECT_ID/devkernelpulse:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY