    <path d="M84 128 L156 92 L84 56 L12 92 Z" fill="url(#emeraldDark)" stroke="#10B981" stroke-opacity="0.5" stroke-width="1.5"/>
    <path d="M12 92 L84 128 L84 146 L12 110 Z" fill="#043927"/>
    <path d="M156 92 L84 128 L84 146 L156 110 Z" fill="#065F46"/>
