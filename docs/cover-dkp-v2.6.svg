  <rect width="1280" height="640" rx="24" fill="url(#cyberGrid)"/>
  <rect width="1280" height="640" rx="24" fill="url(#bgGlow1)"/>
  <rect width="1280" height="640" rx="24" fill="url(#bgGlow2)"/>

