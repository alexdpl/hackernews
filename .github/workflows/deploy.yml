name: Deploy to Google Cloud Run (v2.6-PURE-SQL)

on:
  workflow_run:
    workflows: ["🚀 DKP CI Pipeline (v2.6-PURE-SQL)"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: dkp-deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: project-42be4553-a7a8-477b-80d
  REGION: europe-west4
  IMAGE_PATH: gcr.io/project-42be4553-a7a8-477b-80d/devkernelpulse
  SERVICE_NAME: devkernelpulse
  WORKLOAD_IDENTITY_PROVIDER: projects/920309951767/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  SERVICE_ACCOUNT: github-actions-sa@project-42be4553-a7a8-477b-80d.iam.gserviceaccount.com

jobs:
  build-and-deploy:
    name: Build Container & Rollout Cloud Run
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Authenticate to GCP via WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: 'access_token'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GCR
        uses: docker/login-action@v3
        with:
          registry: gcr.io
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_PATH }}:${{ github.event.workflow_run.head_sha || github.sha }}
            ${{ env.IMAGE_PATH }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run (Native v2.6-PURE-SQL)
        id: deploy
        run: |
          SHA_TAG="${{ github.event.workflow_run.head_sha || github.sha }}"
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE_PATH }}:${SHA_TAG} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --labels=kernel=v2-6-pure-sql \
            --quiet

          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region=${{ env.REGION }} --format='value(status.url)')
          echo "service_url=${SERVICE_URL}" >> $GITHUB_OUTPUT

      - name: Post-Deploy Live Health Verification
        run: |
          echo "Verifica servizio live su: ${{ steps.deploy.outputs.service_url }}"
          curl -fsSL --retry 3 --retry-delay 3 "${{ steps.deploy.outputs.service_url }}/" >/dev/null
          echo "Cloud Run Revision v2.6-PURE-SQL attiva e funzionante!"