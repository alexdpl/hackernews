name: 🚀 DKP CI Pipeline (v2.6-PURE-SQL)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: dkp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_ENV: production
  NITRO_PRESET: node-server

jobs:
  quality-and-integrity:
    name: 🧪 Typecheck, Unit Tests & Pure-SQL Audit
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout del codice
        uses: actions/checkout@v4

      - name: ⚙️ Setup PNPM Engine
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: 🟢 Setup Node.js 22 + PNPM Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 📦 Installazione Dipendenze
        run: pnpm install --frozen-lockfile

      - name: 🔧 Nuxt Prepare (Generazione Tipi v2.6)
        run: pnpm nuxi prepare

      - name: 🔍 Validazione Tipi TypeScript
        run: |
          if node -e "require.resolve('vue-tsc/package.json')" >/dev/null 2>&1; then
            pnpm nuxi typecheck
          else
            echo "⚠️ vue-tsc non presente in devDependencies: salto typecheck."
          fi

      - name: 🛡️ Audit Pure-SQL (Zero Endpoint /api/v2.5/)
        run: |
          if grep -rnE "['\"\`]/api/v2\.5/" app/ server/ 2>/dev/null; then
            echo "❌ Trovate chiamate API legacy /api/v2.5/ nel codice!"
            exit 1
          fi
          echo "✅ Architettura Pure-SQL v2.6 verificata."

      - name: 🧪 Esecuzione Unit & Nuxt Tests (Vitest)
        run: |
          if node -e "require.resolve('vitest/package.json')" >/dev/null 2>&1; then
            pnpm exec vitest run --passWithNoTests
          else
            echo "⚠️ vitest non presente in devDependencies: salto unit test."
          fi

  build-and-smoke-test:
    name: 🏗️ Production Build & Nitro Runtime Smoke Gate
    runs-on: ubuntu-latest
    needs: [quality-and-integrity]
    steps:
      - name: 📥 Checkout del codice
        uses: actions/checkout@v4

      - name: ⚙️ Setup PNPM Engine
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: 🟢 Setup Node.js 22 + PNPM Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 📦 Installazione Dipendenze
        run: pnpm install --frozen-lockfile

      - name: 🚀 Build Produzione Nitro Engine (v2.6)
        run: pnpm run build

      - name: 🔥 Smoke Test Runtime Server Nitro
        env:
          PORT: 3000
          NITRO_PORT: 3000
          HOST: 127.0.0.1
          NITRO_HOST: 127.0.0.1
          NUXT_PUBLIC_SITE_URL: https://devkernelpulse.org
        run: |
          node .output/server/index.mjs > /tmp/nitro.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT

          echo "⏳ Attesa avvio server Nitro su 127.0.0.1:3000..."
          READY=0
          for i in $(seq 1 25); do
            if curl -s -o /dev/null http://127.0.0.1:3000/robots.txt; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "❌ Il server Nitro non si è avviato entro 25 secondi. Log:"
            cat /tmp/nitro.log
            exit 1
          fi

          for route in "/" "/robots.txt" "/sitemap.xml" "/rss.xml" "/llms.txt" "/llms-full.txt" "/ai-knowledge.json"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000${route}")
            echo "GET ${route} -> HTTP ${CODE}"
            if [ "$CODE" -ge 500 ] || [ "$CODE" -eq 000 ]; then
              echo "❌ Errore critico su ${route} (HTTP ${CODE}). Log server:"
              cat /tmp/nitro.log
              exit 1
            fi
          done

          echo "✅ Tutti gli endpoint v2.6 (Core, SEO & AI Visibility) rispondono correttamente!"

  e2e-tests:
    name: 🎭 Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [build-and-smoke-test]
    steps:
      - name: 📥 Checkout del codice
        uses: actions/checkout@v4

      - name: 🔎 Verifica presenza suite Playwright dedicata
        id: check_e2e
        run: |
          if [ -d "tests/playwright" ] || [ -d "tests/e2e" ] || [ -d "e2e" ] || find . -maxdepth 3 -name "*.e2e.spec.ts" | grep -q .; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: ⚙️ Setup PNPM Engine
        if: steps.check_e2e.outputs.has_tests == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: 🟢 Setup Node.js 22 + PNPM Cache
        if: steps.check_e2e.outputs.has_tests == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 📦 Installazione Dipendenze & Browser
        if: steps.check_e2e.outputs.has_tests == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: 🏗️ Build Produzione per E2E
        if: steps.check_e2e.outputs.has_tests == 'true'
        run: pnpm run build

      - name: 🧪 Esecuzione E2E Tests
        if: steps.check_e2e.outputs.has_tests == 'true'
        run: pnpm exec playwright test