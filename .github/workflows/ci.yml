name: DKP CI/CD Pipeline v2.4-GOLD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ==========================================
  # JOB 1: Test e Lint (Il tuo setup originale)
  # ==========================================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
      - run: pnpm install # Assicura che i pacchetti ci siano prima dei test
      - run: pnpm lint
      - run: pnpm test

  # ==========================================
  # JOB 2: Build e Validate (Nuovi step S-TIER)
  # ==========================================
  build-and-validate:
    runs-on: ubuntu-latest
    needs: test # <-- Pipeline sequenziale: esegue la build SOLO se i test sopra passano!

    steps:
      - name: 📥 Checkout del codice
        uses: actions/checkout@v4

      - name: ⚙️ Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8 # o la versione che usi abitualmente

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📦 Installazione Dipendenze
        run: pnpm install

      - name: 🔍 Validazione Tipi (Typecheck)
        run: pnpm nuxi typecheck

      - name: 🏗️ Test di Build (Nitro Engine)
        run: pnpm run build