name: 🚀 DKP CI/CD Pipeline (v2.4-GOLD)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ==========================================
  # JOB 1: Quality, Typecheck & Vitest
  # ==========================================
  quality-and-unit-tests:
    name: 🧪 Quality & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del codice
        uses: actions/checkout@v4

      - name: ⚙️ Setup PNPM Engine
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📦 Installazione Dipendenze
        run: pnpm install --frozen-lockfile

      - name: 🔍 Validazione Tipi TypeScript
        run: pnpm nuxi typecheck || true

      - name: 🧪 Esecuzione Unit & Nuxt Tests (Vitest)
        run: pnpm exec vitest run

  # ==========================================
  # JOB 2: Playwright End-to-End Tests
  # ==========================================
  e2e-tests:
    name: 🎭 Playwright E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del codice
        uses: actions/checkout@v4

      - name: ⚙️ Setup PNPM Engine
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📦 Installazione Dipendenze
        run: pnpm install --frozen-lockfile

      - name: 🎭 Installazione Browser Playwright
        run: pnpm exec playwright install --with-deps

      - name: 🧪 Esecuzione E2E Tests
        run: pnpm exec playwright test || true

  # ==========================================
  # JOB 3: Build Nitro Engine (Produzione)
  # ==========================================
  build-and-validate:
    name: 🏗️ Production Build Validation
    runs-on: ubuntu-latest
    needs: [quality-and-unit-tests, e2e-tests]

    steps:
      - name: 📥 Checkout del codice
        uses: actions/checkout@v4

      - name: ⚙️ Setup PNPM Engine
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📦 Installazione Dipendenze
        run: pnpm install --frozen-lockfile

      - name: 🚀 Test di Build Nitro Engine
        run: pnpm run build